<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">MrSudoXS Telegram Userbot</title>
  <desc id="desc">Telegram selfbot for personal account management and automation, featuring the maintainer's GitHub profile picture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07152f"/><stop offset=".55" stop-color="#102c5c"/><stop offset="1" stop-color="#24134b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#65e4ff"/><stop offset="1" stop-color="#8d7bff"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#37cfff" stop-opacity=".32"/><stop offset="1" stop-color="#37cfff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="avatarClip"><circle cx="930" cy="210" r="63"/></clipPath>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="930" cy="205" r="250" fill="url(#glow)"/>
  <g fill="none" stroke="#7ab8ff" stroke-opacity=".18"><circle cx="930" cy="210" r="138" stroke-width="1.5"/><circle cx="930" cy="210" r="184" stroke-width="1" stroke-dasharray="5 12"/><ellipse cx="930" cy="210" rx="235" ry="88" transform="rotate(-28 930 210)" stroke-width="1.5"/></g>
  <g fill="#a8dfff" opacity=".8"><circle cx="770" cy="105" r="3"/><circle cx="1092" cy="105" r="2.5"/><circle cx="1080" cy="304" r="3"/><circle cx="840" cy="350" r="2"/><circle cx="1142" cy="210" r="2"/><circle cx="790" cy="270" r="2"/></g>
  <g filter="url(#shadow)">
    <circle cx="930" cy="210" r="91" fill="#168eea" fill-opacity=".4" stroke="#69dfff" stroke-opacity=".8" stroke-width="3"/>
    <image href="https://avatars.githubusercontent.com/u/235511036?v=4" x="867" y="147" width="126" height="126" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fff">
    <text x="76" y="112" font-size="19" font-weight="700" letter-spacing="4" fill="#78dcff">PYTHON • TELEGRAM • AUTOMATION</text>
    <text x="72" y="190" font-size="54" font-weight="700">Telegram Userbot</text>
    <text x="76" y="239" font-size="23" fill="#c6d9f5">Personal account management &amp; automation</text>
    <text x="76" y="276" font-size="20" fill="#c6d9f5">ابزارهایی برای مدیریت و خودکارسازی حساب شخصی تلگرام</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="76" y="322" width="126" height="35" rx="17.5" fill="#ffffff" fill-opacity=".1" stroke="#86ddff" stroke-opacity=".45"/><text x="139" y="345" fill="#d9f5ff">PYTHON 3.12+</text>
    <rect x="214" y="322" width="105" height="35" rx="17.5" fill="#ffffff" fill-opacity=".1" stroke="#86ddff" stroke-opacity=".45"/><text x="266" y="345" fill="#d9f5ff">DOCKER</text>
    <rect x="331" y="322" width="105" height="35" rx="17.5" fill="#ffffff" fill-opacity=".1" stroke="#86ddff" stroke-opacity=".45"/><text x="383" y="345" fill="#d9f5ff">TERMUX</text>
  </g>
</svg>
